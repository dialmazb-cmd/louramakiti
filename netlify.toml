# LOURAMAKITI — REDIRECT OLD NETLIFY LINK TO REAL DOMAIN
#
# Before louramakiti.com was set up, this site was shared during testing
# via its auto-generated Netlify address. If that old link is still
# floating around (shared with early testers, cached somewhere, etc.),
# this makes it automatically forward to the real domain instead of
# showing a working, separate copy of the app.
#
# The "conditions = {Host = [...]}" line is what makes this ONLY apply to
# that old address — it does not affect www.louramakiti.com at all, so
# the real site keeps working exactly as it does today. This file
# intentionally contains nothing else (no [build] section), so it can't
# accidentally override the build/publish settings already configured in
# the Netlify dashboard.

[[redirects]]
  from = "/*"
  to = "https://www.louramakiti.com/:splat"
  status = 301
  force = true
  conditions = {Host = ["magical-lebkuchen-8222ce.netlify.app"]}
